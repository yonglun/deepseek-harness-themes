<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">DeepSeek Harness plugin composition</title>
  <desc id="description">A profile loads an npm bundle and Cordis patch, which mount Host and Client plugins. Those plugins contribute settings, themes, UI slots, and locale capabilities without modifying Harness source code.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <linearGradient id="hostAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7257d8"/>
      <stop offset="1" stop-color="#9b79ee"/>
    </linearGradient>
    <linearGradient id="clientAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#168b69"/>
      <stop offset="1" stop-color="#32b889"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1c2d4f" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2f6fdb"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7257d8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#168b69"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 2.2px; }
      .title { font-size: 27px; font-weight: 760; fill: #17223a; }
      .subtitle { font-size: 15px; font-weight: 500; fill: #647089; }
      .lane-title { font-size: 24px; font-weight: 760; fill: #ffffff; }
      .lane-subtitle { font-size: 14px; font-weight: 600; fill: #ffffff; opacity: 0.84; }
      .service-title { font-size: 18px; font-weight: 720; fill: #17223a; }
      .service-subtitle { font-size: 13px; font-weight: 520; fill: #69758d; }
      .edge-label { font-size: 13px; font-weight: 700; fill: #2f6fdb; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="32" fill="url(#background)"/>
  <circle cx="1084" cy="82" r="120" fill="#2f6fdb" opacity="0.045"/>
  <circle cx="102" cy="706" r="160" fill="#7257d8" opacity="0.035"/>

  <g class="sans">
    <text x="70" y="60" class="eyebrow" fill="#2f6fdb">EVERYTHING IS A PLUGIN</text>
    <text x="70" y="98" class="title">One package, two runtimes, four public services</text>

    <g filter="url(#shadow)">
      <rect x="380" y="132" width="440" height="80" rx="22" fill="#ffffff" stroke="#d7e0ef"/>
      <rect x="380" y="132" width="9" height="80" rx="4.5" fill="#2f6fdb"/>
      <text x="600" y="166" text-anchor="middle" class="title" font-size="22">DeepSeek Harness Profile</text>
      <text x="600" y="191" text-anchor="middle" class="subtitle">chooses the ordered runtime composition</text>
    </g>

    <path d="M 600 214 L 600 246" fill="none" stroke="#2f6fdb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="620" y="237" class="edge-label">LOADS</text>

    <g filter="url(#shadow)">
      <rect x="318" y="258" width="564" height="92" rx="24" fill="#17223a"/>
      <text x="600" y="296" text-anchor="middle" class="lane-title" font-size="23">npm Bundle</text>
      <text x="600" y="324" text-anchor="middle" class="lane-subtitle">package code + cordis.patch.yml</text>
    </g>

    <path d="M 600 352 L 600 382 L 330 382 L 330 412" fill="none" stroke="#2f6fdb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M 600 382 L 870 382 L 870 412" fill="none" stroke="#2f6fdb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="620" y="375" class="edge-label">MOUNTS</text>

    <g filter="url(#shadow)">
      <rect x="72" y="424" width="516" height="194" rx="26" fill="#ffffff" stroke="#ddd6f7"/>
      <rect x="72" y="424" width="516" height="68" rx="26" fill="url(#hostAccent)"/>
      <path d="M 72 466 L 72 492 L 588 492 L 588 466" fill="url(#hostAccent)"/>
      <text x="102" y="455" class="lane-title">Host Plugin</text>
      <text x="102" y="478" class="lane-subtitle">Node.js · registration and persistence</text>

      <rect x="102" y="516" width="456" height="74" rx="18" fill="#f8f6ff" stroke="#ddd6f7"/>
      <circle cx="136" cy="553" r="16" fill="#7257d8" opacity="0.14"/>
      <path d="M 129 553 L 134 558 L 144 547" fill="none" stroke="#7257d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="166" y="548" class="service-title">Settings Service</text>
      <text x="166" y="570" class="service-subtitle">plugin-owned schema and namespace</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="612" y="424" width="516" height="194" rx="26" fill="#ffffff" stroke="#cfe9df"/>
      <rect x="612" y="424" width="516" height="68" rx="26" fill="url(#clientAccent)"/>
      <path d="M 612 466 L 612 492 L 1128 492 L 1128 466" fill="url(#clientAccent)"/>
      <text x="642" y="455" class="lane-title">Client Plugin</text>
      <text x="642" y="478" class="lane-subtitle">Browser · presentation and interaction</text>

      <g>
        <rect x="640" y="512" width="218" height="44" rx="14" fill="#f2fbf7" stroke="#cfe9df"/>
        <circle cx="663" cy="534" r="7" fill="#168b69"/>
        <text x="680" y="540" class="service-title" font-size="16">Theme Service</text>

        <rect x="882" y="512" width="218" height="44" rx="14" fill="#f2fbf7" stroke="#cfe9df"/>
        <circle cx="905" cy="534" r="7" fill="#168b69"/>
        <text x="922" y="540" class="service-title" font-size="16">Settings Scope</text>

        <rect x="640" y="566" width="218" height="44" rx="14" fill="#f2fbf7" stroke="#cfe9df"/>
        <circle cx="663" cy="588" r="7" fill="#168b69"/>
        <text x="680" y="594" class="service-title" font-size="16">UI Slots</text>

        <rect x="882" y="566" width="218" height="44" rx="14" fill="#f2fbf7" stroke="#cfe9df"/>
        <circle cx="905" cy="588" r="7" fill="#168b69"/>
        <text x="922" y="594" class="service-title" font-size="16">Locale Service</text>
      </g>
    </g>

    <path d="M 330 620 L 330 647 L 600 682" fill="none" stroke="#7257d8" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M 870 620 L 870 647 L 600 682" fill="none" stroke="#168b69" stroke-width="3" marker-end="url(#arrowGreen)"/>

    <g filter="url(#shadow)">
      <rect x="298" y="670" width="604" height="62" rx="20" fill="#ffffff" stroke="#d7e0ef"/>
      <text x="600" y="698" text-anchor="middle" class="service-title">One removable capability contribution</text>
      <text x="600" y="720" text-anchor="middle" class="service-subtitle">No Harness source modification</text>
    </g>
  </g>
</svg>
